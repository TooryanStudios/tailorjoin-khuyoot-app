<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧪 REST Auth Test</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 400px;
      width: 100%;
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s;
      box-sizing: border-box;
    }
    input:focus {
      outline: none;
      border-color: #667eea;
    }
    button {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
    }
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
    }
    .status.success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .status.error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .status.loading {
      background: #fff3cd;
      color: #856404;
      border: 1px solid #ffeeba;
    }
    pre {
      background: #f4f4f4;
      padding: 10px;
      border-radius: 5px;
      overflow-x: auto;
      font-size: 12px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧪 REST Auth Test</h1>
    <input type="email" id="email" placeholder="البريد الإلكتروني" value="diag_user_01@test.com" />
    <input type="password" id="password" placeholder="كلمة المرور" value="TestPass@123" />
    <button class="btn-primary" id="loginBtn" onclick="testLogin()">🔐 تسجيل الدخول (REST)</button>
    <div id="status"></div>
  </div>

  <script type="module">
    import { signInWithEmailPasswordREST } from './src/services/authBypass.ts';

    window.testLogin = async function() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const statusDiv = document.getElementById('status');
      const loginBtn = document.getElementById('loginBtn');

      if (!email || !password) {
        statusDiv.className = 'status error';
        statusDiv.innerHTML = '❌ الرجاء إدخال البريد الإلكتروني وكلمة المرور';
        return;
      }

      try {
        loginBtn.disabled = true;
        statusDiv.className = 'status loading';
        statusDiv.innerHTML = '⏳ جاري تسجيل الدخول...';

        console.log('[Test] Attempting sign-in with:', {
          email,
          password: password.substring(0, 3) + '***'
        });

        const startTime = performance.now();
        const result = await signInWithEmailPasswordREST(email, password);
        const elapsed = Math.round(performance.now() - startTime);

        console.log('[Test] Sign-in result:', result);

        if (result.success) {
          statusDiv.className = 'status success';
          statusDiv.innerHTML = `
            ✅ نجح تسجيل الدخول! (${elapsed}ms)<br>
            <strong>UID:</strong> ${result.data.localId}<br>
            <strong>Email:</strong> ${result.data.email}<br>
            <strong>Registered:</strong> ${result.data.registered}<br>
            <strong>Token:</strong> ${result.data.idToken.substring(0, 50)}...
            <pre>${JSON.stringify(result.data, null, 2)}</pre>
          `;
        } else {
          statusDiv.className = 'status error';
          statusDiv.innerHTML = `
            ❌ فشل تسجيل الدخول (${elapsed}ms)<br>
            <strong>Error:</strong> ${result.error}<br>
            <strong>Code:</strong> ${result.code || 'N/A'}
          `;
        }
      } catch (error) {
        statusDiv.className = 'status error';
        statusDiv.innerHTML = `❌ خطأ غير متوقع: ${error.message}`;
      } finally {
        loginBtn.disabled = false;
      }
    };
  </script>
</body>
</html>
