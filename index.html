    <!-- CRITICAL: Apply theme before first paint to prevent flash -->
    <script>
      (function() {
        try {
          // Prevent layout chrome (header/footer) from flashing before config loads
          document.documentElement.setAttribute('data-shell-ready', '0');
          document.documentElement.classList.add('hide-shell-elements');

          const savedTheme = localStorage.getItem('theme');
          const appSettings = localStorage.getItem('app_settings');
          let theme = 'dark'; // default
          
          if (savedTheme) {
            theme = savedTheme;
          } else if (appSettings) {
            try {
              const settings = JSON.parse(appSettings);
              if (settings.defaultTheme) theme = settings.defaultTheme;
            } catch (e) {}
          }
          
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          // Fallback to dark mode on error
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <style>
      /* Zero-flash guard: do not allow header/footer to paint until the app marks shell ready */
      html[data-shell-ready="0"] .app-header,
      html[data-shell-ready="0"] .app-footer {
        display: none !important;
      }

      html.hide-shell-elements .app-header,
      html.hide-shell-elements .app-footer {
        display: none !important;
      }
    </style>

        <!-- HashRouter compatibility: redirect clean paths to hash-based routes -->
        <script>
          (function() {
            try {
              var hasHashRoute = location.hash && location.hash.indexOf('#/') === 0;
              var path = location.pathname || '/';
              // If user navigates to /join-tailor (no hash) and we use HashRouter, rewrite to /#/join-tailor
              if (!hasHashRoute && path !== '/') {
                var newUrl = location.origin + '/#' + path + (location.search || '') + (location.hash || '');
                location.replace(newUrl);
              }
            } catch (e) {
              // no-op
            }
          })();
        </script>

    <!-- DEV: Forcefully remove any active Service Workers and manifest to prevent Workbox from intercepting Vite dev requests -->
    <script>
      (function() {
        const isDev = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        if (isDev) {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
            if ('caches' in window) {
              caches.keys().then(names => names.forEach(n => caches.delete(n)));
            }
          }
          // Remove manifest link in development to avoid unnecessary requests
          const manifestLink = document.querySelector('link[rel="manifest"]');
          if (manifestLink) manifestLink.remove();
        }
      })();
    </script>

    <!-- Suppress Tailwind CDN warning in console -->
    <script>
      if (typeof window !== 'undefined') {
        const originalWarn = console.warn;
        console.warn = function(...args) {
          if (args[0]?.includes?.('cdn.tailwindcss.com should not be used in production')) {
            return; // Suppress this specific warning
          }
          originalWarn.apply(console, args);
        };
        
        // Suppress share-modal.js errors completely
        const originalError = console.error;
        console.error = function(...args) {
          const msg = args[0]?.toString?.() || '';
          // Suppress share-modal and common DOM errors from it
          if (msg.includes('share-modal') || 
              msg.includes('addEventListener') ||
              (msg.includes('Cannot read properties of null') && args[1]?.includes?.('share-modal'))) {
            return; // Suppress
          }
          originalError.apply(console, args);
        };

        // Suppress uncaught runtime errors from share-modal.js
        window.addEventListener('error', function (event) {
          try {
            const filename = event?.filename || '';
            const message = event?.message || '';
            const stack = event?.error?.stack || '';
            
            if (filename.includes('share-modal') || 
                message.includes('share-modal') ||
                stack.includes('share-modal')) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return true;
            }
          } catch {
            // no-op
          }
        }, true);
        
        // Also catch unhandled promise rejections from share-modal
        window.addEventListener('unhandledrejection', function (event) {
          try {
            const reason = event?.reason?.toString?.() || '';
            if (reason.includes('share-modal')) {
              event.preventDefault();
              return true;
            }
          } catch {
            // no-op
          }
        });
      }
    </script>

    <style>
      /* تثبيت الحجم ومنع السحب خارج الشاشة */
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        max-width: 100%;
        overflow-x: hidden;
        background-color: #f8fafc;
      }

      body {
        font-family: 'Cairo', sans-serif;
        color: #0f172a;
        transition: background-color 0.3s ease, color 0.3s ease;
        overflow-x: hidden;
        width: 100%;
        overscroll-behavior-x: none; /* لتخفيف السحب الأفقي */
      }

      /* الجذر يأخذ ارتفاع الشاشة بالكامل حتى لا يكون في فراغ حوله */
      #root {
        width: 100vw;
        min-height: 100vh;
        margin: 0 !important;
        padding: 0 !important;
        display: block !important; /* Prevents flex-centering of the whole app */
        background-color: inherit;
      }
      
      /* Dark mode overrides (في حال استخدمت html.classList.add('dark')) */
      .dark body {
        background-color: #050817;
        color: #f8fafc;
      }

      .dark #root {
        background-color: inherit;
      }

      /* Hide scrollbar for chrome/safari/opera */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }

      /* Fade in animation */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-fadeIn {
        animation: fadeIn 0.3s ease-out;
      }

      /* Fade in animation for labels */
      @keyframes fade-in {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      .animate-fade-in {
        animation: fade-in 0.2s ease-out;
      }

      /* Gradient animation */
      @keyframes gradient-x {
        0%, 100% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
      }
      .animate-gradient-x {
        background-size: 200% 200%;
        animation: gradient-x 3s ease infinite;
      }

      /* Pulse animation for icons */
      @keyframes pulse-icon {
        0%, 100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.8;
          transform: scale(1.1);
        }
      }
      .animate-pulse-icon {
        animation: pulse-icon 2s ease-in-out infinite;
      }
      
      /* Scale in animation for modals */
      @keyframes scale-in {
        0% {
          opacity: 0;
          transform: scale(0.9);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }
      .animate-scale-in {
        animation: scale-in 0.2s ease-out;
      }

      @keyframes slide-up {
        0% {
          opacity: 0;
          transform: translateY(100%);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-slide-up {
        animation: slide-up 0.3s ease-out;
      }

      @keyframes fade-in {
        0% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }
      .animate-fade-in {
        animation: fade-in 0.2s ease-out;
      }

      /* Shimmer animation for skeleton loaders */
      @keyframes shimmer {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(100%);
        }
      }

      /* Better mobile scrolling */
      @media (max-width: 768px) {
        * {
          -webkit-tap-highlight-color: transparent;
        }
        
        input, textarea, button {
          -webkit-appearance: none;
          appearance: none;
        }
      }
    </style>
