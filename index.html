    <!-- مهم جداً على iOS: إضافة viewport-fit=cover -->
    <!-- منع zoom لضمان دقة المقاسات في PWA -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />

    <!-- DEV: If a stale PWA Service Worker is controlling localhost, it can serve old cached JS
         (causing blank-first-render + share-modal.js errors). Redirect to the SW cleanup page. -->
    <script>
      (function () {
        try {
          var isDev = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
          if (!isDev) return;
          if (!('serviceWorker' in navigator)) return;

          // If a SW is currently controlling this page, fix it deterministically.
          if (navigator.serviceWorker.controller && !location.pathname.startsWith('/clear-sw.html')) {
            var returnTo = location.pathname + (location.search || '') + (location.hash || '');
            location.replace('/clear-sw.html?auto=1&return=' + encodeURIComponent(returnTo));
          }
        } catch {
          // no-op
        }
      })();
    </script>

    <!-- CRITICAL: Apply language before React loads to prevent flash -->
    <script>
      (function() {
        try {
          const savedLang = localStorage.getItem('i18nextLng') || localStorage.getItem('language') || 'ar';
          const lang = String(savedLang).toLowerCase().split('-')[0];
          
          document.documentElement.lang = lang;
          document.documentElement.dir = (lang === 'ar' || lang === 'ur' || lang === 'he') ? 'rtl' : 'ltr';
        } catch (e) {
          // Fallback to default (Arabic)
          document.documentElement.lang = 'ar';
          document.documentElement.dir = 'rtl';
        }
      })();
    </script>

    <!-- CRITICAL: Apply theme before first paint to prevent flash -->
    <script>
      (function() {
        try {
          const savedTheme = localStorage.getItem('theme');
          const appSettings = localStorage.getItem('app_settings');
          let theme = 'dark'; // default
          
          if (savedTheme) {
            theme = savedTheme;
          } else if (appSettings) {
            try {
              const settings = JSON.parse(appSettings);
              if (settings.defaultTheme) theme = settings.defaultTheme;
            } catch (e) {}
          }
          
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          }

          // Apply theme colors early to avoid flash
          let primary = '#CFFF04';
          let secondary = '#D4AF37';
          if (appSettings) {
            try {
              const settings = JSON.parse(appSettings);
              if (settings?.themeColors?.primary) primary = settings.themeColors.primary;
              if (settings?.themeColors?.secondary) secondary = settings.themeColors.secondary;
            } catch (e) {}
          }
          document.documentElement.style.setProperty('--theme-primary', primary);
          document.documentElement.style.setProperty('--theme-secondary', secondary);
        } catch (e) {
          // Fallback to dark mode on error
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

        <!-- Legacy HashRouter compatibility (narrowly scoped):
             Only rewrite tailor-join deep links on the tailorjoin subdomain.
             The app uses BrowserRouter for normal navigation; broad rewrites break nested routes like /demo-shell/b. -->
        <script>
          (function() {
            try {
              var hostname = location.hostname || '';
              var path = location.pathname || '/';
              var hasHashRoute = location.hash && location.hash.indexOf('#/') === 0;

              var isTailorJoinDomain = hostname === 'tailorjoin.khuyoot.app';
              var isTailorJoinPath = path === '/join-tailor' || path.indexOf('/join-tailor/') === 0;

              if (isTailorJoinDomain && isTailorJoinPath && !hasHashRoute) {
                var newUrl = location.origin + '/#' + path + (location.search || '') + (location.hash || '');
                location.replace(newUrl);
              }
            } catch (e) {
              // no-op
            }
          })();
        </script>

    <!-- DEV: Remove any active Service Workers + caches to keep Vite dev deterministic -->
    <script>
      (function() {
        try {
          const isDev = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
          if (!isDev) return;
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister()));
          }
          if ('caches' in window) {
            caches.keys().then((names) => names.forEach((n) => caches.delete(n)));
          }
          // Remove manifest link in development to avoid unnecessary requests
          const manifestLink = document.querySelector('link[rel="manifest"]');
          if (manifestLink) manifestLink.remove();
        } catch {
          // no-op
        }
      })();
    </script>

    <!-- Suppress Tailwind CDN warning in console (keep real errors visible) -->
    <script>
      if (typeof window !== 'undefined') {
        const originalWarn = console.warn;
        console.warn = function (...args) {
          if (args[0]?.includes?.('cdn.tailwindcss.com should not be used in production')) return;
          originalWarn.apply(console, args);
        };
      }
    </script>

    <style>
      :root {
        --theme-primary: #CFFF04;

      /* Khiyoot Glass Surface helpers */
      .khiyoot-glass {
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);

      .bg-boutique-dark { background-color: #0F051D; }
      .text-gold-400 { color: #D4AF37; }

      /* تثبيت الحجم ومنع السحب خارج الشاشة */
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        max-width: 100%;
        overflow-x: hidden;
        background-color: #f8fafc;
      }

      body {
        font-family: 'Cairo', sans-serif;
        color: #0f172a;
        transition: background-color 0.3s ease, color 0.3s ease;
        overflow-x: hidden;
        width: 100%;
        overscroll-behavior-x: none; /* لتخفيف السحب الأفقي */
      }

      /* الجذر يأخذ ارتفاع الشاشة بالكامل حتى لا يكون في فراغ حوله */
      #root {
        width: 100vw;
        min-height: 100vh;
        margin: 0 !important;
        padding: 0 !important;
        display: block !important; /* Prevents flex-centering of the whole app */
        background-color: #0a0a0a;
        color: white;
      }
      
      /* Dark mode overrides (في حال استخدمت html.classList.add('dark')) */
      .dark body {
        background-color: #050817;
        color: #f8fafc;
      }

      .dark #root {
        background-color: inherit;
      }

      /* Hide scrollbar for chrome/safari/opera */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
      }

      /* Fade in animation */
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-fadeIn {
        animation: fadeIn 0.3s ease-out;
      }

      /* Fade in animation for labels */
      @keyframes fade-in {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      .animate-fade-in {
        animation: fade-in 0.2s ease-out;
      }

      /* Gradient animation */
      @keyframes gradient-x {
        0%, 100% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
      }
      .animate-gradient-x {
        background-size: 200% 200%;
        animation: gradient-x 3s ease infinite;
      }

      /* Pulse animation for icons */
      @keyframes pulse-icon {
        0%, 100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.8;
          transform: scale(1.1);
        }
      }
      .animate-pulse-icon {
        animation: pulse-icon 2s ease-in-out infinite;
      }
      
      /* Scale in animation for modals */
      @keyframes scale-in {
        0% {
          opacity: 0;
          transform: scale(0.9);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }
      .animate-scale-in {
        animation: scale-in 0.2s ease-out;
      }

      @keyframes slide-up {
        0% {
          opacity: 0;
          transform: translateY(100%);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-slide-up {
        animation: slide-up 0.3s ease-out;
      }

      @keyframes fade-in {
        0% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }
      .animate-fade-in {
        animation: fade-in 0.2s ease-out;
      }

      /* Shimmer animation for skeleton loaders */
      @keyframes shimmer {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(100%);
        }
      }

      /* Better mobile scrolling */
      @media (max-width: 768px) {
        * {
          -webkit-tap-highlight-color: transparent;
        }
        
        input, textarea, button {
          -webkit-appearance: none;
          appearance: none;
        }
      }
    </style>

    <div id="root" style="background: #0a0a0a; color: white; min-height: 100vh;">
      <!-- Inline splash screen before React loads -->
      <div style="position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0a0a0a; z-index: 9999;">
        <div style="text-align: center;">
          <img src="/logo_big.png?v=4" alt="خيوط" style="width: 200px; height: 200px; margin: 0 auto; object-fit: contain;">
        </div>
      </div>
    </div>

    <!-- Global Error Handler: If React fails to mount (e.g. 500 on import), replace splash with Error UI -->
    <script>
      (function() {
        function showGlobalError() {
          const root = document.getElementById('root');
          if (!root) return;
          // Check if we are still on the splash screen (logo_big present)
          if (!root.innerHTML.includes('logo_big.png?v=4')) return;
          // Avoid double render
          if (root.getAttribute('data-error-shown')) return;
          root.setAttribute('data-error-shown', 'true');

          root.innerHTML = `
            <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; text-align: center; background-color: #050817; color: white; font-family: 'Cairo', sans-serif;">
              <div style="width: 80px; height: 80px; margin-bottom: 1.5rem; position: relative;">
                  <img src="/logo.png" alt="Logo" style="width: 100%; height: 100%; object-fit: contain;">
              </div>
              
              <div style="max-width: 28rem; margin: 0 auto;">
                  <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 0.5rem;">We have a technical issue</h2>
                  <p style="font-size: 0.875rem; color: #94a3b8; line-height: 1.6;">
                      Please refresh the page to continue.
                      <br />
                      <span style="opacity: 0.8; display: block; margin-top: 0.25rem; font-family: 'Cairo', sans-serif;">نواجه مشكلة فنية، يرجى تحديث الصفحة</span>
                  </p>
              </div>

              <div style="margin-top: 2rem; display: flex; gap: 0.75rem; flex-wrap: wrap; justify-content: center;">
                  <button onclick="window.location.reload()" style="display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.625rem 1.5rem; border-radius: 9999px; background-color: white; color: #0f172a; font-size: 0.875rem; font-weight: 700; border: none; cursor: pointer; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 12"></path><path d="M3 3v9h9"></path></svg>
                      <span>Refresh Page</span>
                  </button>
                  
                  <button onclick="localStorage.clear(); window.location.reload()" style="display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.625rem 1rem; border-radius: 9999px; background-color: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #cbd5e1; font-size: 0.875rem; font-weight: 500; cursor: pointer;">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                      <span>Clear Cache</span>
                  </button>
              </div>
            </div>
          `;
        }

        window.addEventListener('error', showGlobalError);
        window.addEventListener('unhandledrejection', showGlobalError);
      })();
    </script>
