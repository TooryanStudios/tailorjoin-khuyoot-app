<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firebase Auth Diagnostic</title>
  <style>
    body {
      font-family: monospace;
      padding: 20px;
      background: #1a1a1a;
      color: #00ff00;
    }
    .log {
      margin: 5px 0;
      padding: 5px;
      background: #2a2a2a;
      border-left: 3px solid #00ff00;
    }
    .error {
      border-left-color: #ff0000;
      color: #ff6666;
    }
    .success {
      border-left-color: #00ff00;
      color: #66ff66;
    }
    .warning {
      border-left-color: #ffaa00;
      color: #ffcc66;
    }
    button {
      background: #00ff00;
      color: #000;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      margin: 10px 5px;
    }
    button:hover {
      background: #00cc00;
    }
    input {
      background: #111;
      color: #00ff00;
      border: 1px solid #00ff00;
      padding: 8px 10px;
      margin: 5px 5px 5px 0;
      font-size: 14px;
      border-radius: 4px;
      width: 240px;
    }
    button.copied {
      background: #0088ff;
      color: #fff;
    }
    .header-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .signin-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      margin: 10px 0 20px;
    }
    .status {
      margin: 0 0 16px;
      padding: 10px 12px;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      color: #c7ffd1;
    }
    .status small {
      color: #9ad4a7;
      display: block;
      margin-top: 4px;
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      padding: 16px;
    }
    .modal {
      max-width: 520px;
      width: 100%;
      background: #0b0b0b;
      border: 1px solid #333;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    }
    .modal-header {
      padding: 16px 20px;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #111;
      color: #ff6666;
      font-weight: bold;
    }
    .modal-body {
      padding: 20px;
      color: #ffb3b3;
      font-size: 14px;
      line-height: 1.5;
    }
    .modal-footer {
      padding: 16px 20px;
      border-top: 1px solid #222;
      display: flex;
      justify-content: flex-end;
      background: #111;
    }
    .modal-close {
      background: #ff6666;
      color: #000;
      border: none;
      padding: 8px 14px;
      cursor: pointer;
      font-weight: bold;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <div class="header-controls">
    <div>
      <h1>🔥 Firebase Auth Connectivity Diagnostic</h1>
      <p>This tool tests direct Firebase Auth SDK connectivity without the app code.</p>
    </div>
    <button id="copyBtn" onclick="copyLogs()">📋 Copy Logs</button>
  </div>

  <div class="signin-controls">
    <input id="emailInput" type="email" placeholder="Email" value="admin@test.com" />
    <input id="passwordInput" type="password" placeholder="Password" value="" />
    <button id="signInBtn" onclick="signInFromUi()">🔐 Sign In</button>
    <button id="signOutBtn" onclick="signOutFromUi()">🚪 Sign Out</button>
    <button id="clearSessionBtn" onclick="clearAuthSessionFromUi()">🧽 Clear Session</button>
    <button id="clearSwBtn" onclick="clearSwAndCachesFromUi()">🧹 Clear SW + Caches</button>
    <button id="iframeTestBtn" onclick="testAuthIframeFromUi()">🧩 Test Auth Iframe</button>
    <label style="color:#ffcc66; font-size:13px; display:inline-flex; align-items:center; gap:4px; margin:0 5px; cursor:pointer; border:1px solid #444; padding:4px 8px; border-radius:4px;" title="Sets appVerificationDisabledForTesting=true to bypass Recaptcha">
      <input type="checkbox" id="disableRecaptchaCheckbox"> 🚫 Bypass Recaptcha
    </label>
    <select id="persistenceSelect" aria-label="Persistence mode">
      <option value="local">Local (IndexedDB)</option>
      <option value="session">Session (sessionStorage)</option>
      <option value="memory">Memory (no persistence)</option>
    </select>
    <button id="applyModeBtn" onclick="applyPersistenceModeFromUi()">⚙️ Apply Mode</button>
  </div>

  <div id="status" class="status">Status: initializing…</div>
  
  <div id="logs"></div>

  <div id="errorModal" class="modal-overlay" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal">
      <div class="modal-header">
        <span id="errorTitle">خطأ</span>
        <button class="modal-close" onclick="closeErrorModal()">✕</button>
      </div>
      <div class="modal-body" id="errorMessage"></div>
      <div class="modal-footer">
        <button class="modal-close" onclick="closeErrorModal()">إغلاق</button>
      </div>
    </div>
  </div>

  <script>
    // Pre-module network instrumentation
    // NOTE: Module imports execute before any code in <script type="module">, so if the Firebase SDK
    // captures references to fetch/XHR during module evaluation, we must instrument here (before imports).
    (function preModuleNetworkInstrumentation() {
      try {
        if (window.__preModuleNetReady) return;
        window.__preModuleNetReady = true;

        window.__interestingFetchCount = window.__interestingFetchCount || 0;
        window.__netLogQueue = window.__netLogQueue || [];

        const isInterestingUrl = (url) => {
          if (typeof url !== 'string') return false;
          return (
            url.includes('identitytoolkit.googleapis.com') ||
            url.includes('securetoken.googleapis.com') ||
            url.includes('www.googleapis.com') ||
            url.includes('/__/auth/iframe') ||
            url.includes('__/auth/iframe') ||
            url.includes('google.com/recaptcha') ||
            url.includes('gstatic.com/recaptcha') ||
            url.includes('recaptcha')
          );
        };

        const queueNetLog = (message, type) => {
          try {
            window.__netLogQueue.push({ message: String(message || ''), type: type || 'log', t: Date.now() });
          } catch {}
          try {
            console.log(message);
          } catch {}
        };

        window.__flushNetLogQueue = function(logger) {
          try {
            const logFn = typeof logger === 'function' ? logger : null;
            const q = Array.isArray(window.__netLogQueue) ? window.__netLogQueue : [];
            if (!logFn || q.length === 0) return;
            for (const item of q) {
              logFn(item.message, item.type || 'log');
            }
            window.__netLogQueue = [];
          } catch {}
        };

        // fetch
        /* DISABLED FOR DEBUGGING
        try {
          const originalFetch = window.fetch?.bind(window);
          if (originalFetch && !window.__fetchInstrumented) {
            window.__fetchInstrumented = true;
            window.fetch = async (input, init) => {
              const url = typeof input === 'string' ? input : input?.url;
              const method = (init?.method || (typeof input !== 'string' ? input?.method : 'GET') || 'GET').toUpperCase();
              const startedAt = performance.now();
              const interesting = isInterestingUrl(url);
              if (interesting) {
                window.__interestingFetchCount = (window.__interestingFetchCount || 0) + 1;
                queueNetLog(`🌍 fetch ${method} ${url}`, 'log');
              }
              try {
                const res = await originalFetch(input, init);
                if (interesting) {
                  const ms = Math.round(performance.now() - startedAt);
                  queueNetLog(`🌍 fetch DONE ${res.status} (${ms}ms) ${method} ${url}`, res.ok ? 'success' : 'warning');
                }
                return res;
              } catch (e) {
                if (interesting) {
                  const ms = Math.round(performance.now() - startedAt);
                  queueNetLog(`🌍 fetch FAILED (${ms}ms) ${method} ${url} :: ${e?.message || e}`, 'error');
                }
                throw e;
              }
            };
          }
        } catch {}
        */

        // XHR
        /* DISABLED FOR DEBUGGING
        try {
          const XHR = window.XMLHttpRequest;
          if (XHR && XHR.prototype && !window.__xhrInstrumented) {
            window.__xhrInstrumented = true;
            const originalOpen = XHR.prototype.open;
            const originalSend = XHR.prototype.send;
            XHR.prototype.open = function(method, url) {
              try {
                this.__diag_method = String(method || 'GET').toUpperCase();
                this.__diag_url = String(url || '');
              } catch {}
              return originalOpen.apply(this, arguments);
            };
            XHR.prototype.send = function(body) {
              const url = this.__diag_url;
              const method = this.__diag_method || 'GET';
              const startedAt = performance.now();
              const interesting = isInterestingUrl(url);
              if (interesting) {
                window.__interestingFetchCount = (window.__interestingFetchCount || 0) + 1;
                queueNetLog(`🌍 XHR ${method} ${url}`, 'log');
              }
              const onDone = () => {
                try {
                  if (!interesting) return;
                  const ms = Math.round(performance.now() - startedAt);
                  const status = this.status;
                  queueNetLog(`🌍 XHR DONE ${status} (${ms}ms) ${method} ${url}`, status >= 200 && status < 300 ? 'success' : 'warning');
                } catch {}
              };
              try {
                this.addEventListener('loadend', onDone);
              } catch {}
              return originalSend.apply(this, arguments);
            };
          }
        } catch {}
        */
      } catch {}
    })();

    // Copy logs function
    window.copyLogs = function() {
      const logsContainer = document.getElementById('logs');
      const copyBtn = document.getElementById('copyBtn');
      const logTexts = Array.from(logsContainer.children).map(div => div.textContent).join('\n');
      
      navigator.clipboard.writeText(logTexts).then(() => {
        copyBtn.textContent = '✅ Copied!';
        copyBtn.classList.add('copied');
        setTimeout(() => {
          copyBtn.textContent = '📋 Copy Logs';
          copyBtn.classList.remove('copied');
        }, 2000);
      }).catch(err => {
        copyBtn.textContent = '❌ Failed';
        console.error('Copy failed:', err);
      });
    };

    window.signInFromUi = function() {
      if (typeof window.__diagLog === 'function') {
        window.__diagLog('🔘 Sign In button clicked', 'log');
      }
      if (typeof window.__runSignInTest === 'function') {
        const email = document.getElementById('emailInput')?.value || '';
        const password = document.getElementById('passwordInput')?.value || '';
        window.__runSignInTest(email, password);
      } else {
        console.error('Sign-in handler is not ready (window.__runSignInTest is missing). Module script may have failed to load.');
        if (typeof window.openErrorModal === 'function') {
          window.openErrorModal(
            'أداة التشخيص غير جاهزة',
            'لم يتم تحميل كود Firebase بعد (Sign-in handler غير موجود). افتح Console لمعرفة الخطأ، ثم أعد تحميل الصفحة.'
          );
        }
      }
    };

    window.signOutFromUi = function() {
      if (typeof window.__runSignOut === 'function') {
        window.__runSignOut();
      }
    };

    window.clearAuthSessionFromUi = function() {
      if (typeof window.__runClearAuthSession === 'function') {
        window.__runClearAuthSession();
      }
    };

    window.clearSwAndCachesFromUi = function() {
      if (typeof window.__runClearSwAndCaches === 'function') {
        window.__runClearSwAndCaches();
      } else {
        console.error('SW cleanup handler is not ready (window.__runClearSwAndCaches is missing).');
      }
    };

    window.testAuthIframeFromUi = function() {
      if (typeof window.__diagLog === 'function') {
        window.__diagLog('🔘 Test Auth Iframe button clicked', 'log');
      }
      if (typeof window.__runAuthIframeTest === 'function') {
        window.__runAuthIframeTest();
      } else {
        console.error('Auth iframe test handler is not ready (window.__runAuthIframeTest is missing).');
        if (typeof window.openErrorModal === 'function') {
          window.openErrorModal(
            'أداة التشخيص غير جاهزة',
            'لم يتم تحميل كود Firebase بعد (Auth iframe test handler غير موجود). افتح Console لمعرفة الخطأ، ثم أعد تحميل الصفحة.'
          );
        }
      }
    };

    window.applyPersistenceModeFromUi = function() {
      const sel = document.getElementById('persistenceSelect');
      const mode = sel?.value || 'local';
      try {
        const url = new URL(location.href);
        url.searchParams.set('p', mode);
        location.href = url.toString();
      } catch (e) {
        console.error('Failed to apply persistence mode', e);
      }
    };

    window.openErrorModal = function(title, message) {
      const modal = document.getElementById('errorModal');
      const titleEl = document.getElementById('errorTitle');
      const messageEl = document.getElementById('errorMessage');
      if (!modal || !titleEl || !messageEl) return;
      titleEl.textContent = title || 'خطأ';
      messageEl.textContent = message || 'حدث خطأ غير متوقع.';
      modal.style.display = 'flex';
      modal.setAttribute('aria-hidden', 'false');
    };

    window.closeErrorModal = function() {
      const modal = document.getElementById('errorModal');
      if (!modal) return;
      modal.style.display = 'none';
      modal.setAttribute('aria-hidden', 'true');
    };
  </script>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js';
    import { 
      initializeAuth,
      signInWithEmailAndPassword, 
      signOut,
      onAuthStateChanged,
      browserLocalPersistence,
      browserSessionPersistence,
      inMemoryPersistence
    } from 'https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js';

    const logsContainer = document.getElementById('logs');
    const statusEl = document.getElementById('status');
    const signInBtn = document.getElementById('signInBtn');
    const signOutBtn = document.getElementById('signOutBtn');
    const passwordInput = document.getElementById('passwordInput');
    const persistenceSelect = document.getElementById('persistenceSelect');
    const clearSwBtn = document.getElementById('clearSwBtn');

    function log(message, type = 'log') {
      const div = document.createElement('div');
      div.className = `log ${type}`;
      div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      logsContainer.appendChild(div);
      logsContainer.scrollTop = logsContainer.scrollHeight;
      console.log(message);
    }

    // Expose logger for non-module onclick handlers
    window.__diagLog = log;

    // Flush any pre-module network logs captured before the module was evaluated.
    if (typeof window.__flushNetLogQueue === 'function') {
      try { window.__flushNetLogQueue(log); } catch {}
    }

    function setStatus(html) {
      if (!statusEl) return;
      statusEl.innerHTML = html;
    }

    function getHostHint() {
      try {
        return `${location.protocol}//${location.host}`;
      } catch {
        return 'http://localhost:3000';
      }
    }

    function setSignedInUi(isSignedIn) {
      if (signInBtn) signInBtn.disabled = !!isSignedIn;
      if (signOutBtn) signOutBtn.disabled = !isSignedIn;
      if (passwordInput) passwordInput.disabled = !!isSignedIn;
    }

    function getPersistenceMode() {
      try {
        const params = new URLSearchParams(location.search);
        const mode = (params.get('p') || 'local').toLowerCase();
        if (mode === 'memory' || mode === 'session' || mode === 'local') return mode;
      } catch {}
      return 'local';
    }

    function instrumentFetch() {
      const originalFetch = window.fetch?.bind(window);
      if (!originalFetch) {
        log('⚠️ window.fetch is not available; cannot instrument network calls', 'warning');
        return;
      }

      if (window.__fetchInstrumented) return;
      window.__fetchInstrumented = true;

      window.__interestingFetchCount = 0;

      window.fetch = async (input, init) => {
        const url = typeof input === 'string' ? input : input?.url;
        const method = (init?.method || (typeof input !== 'string' ? input?.method : 'GET') || 'GET').toUpperCase();
        const startedAt = performance.now();

        const isInteresting = typeof url === 'string' && (
          url.includes('identitytoolkit.googleapis.com') ||
          url.includes('securetoken.googleapis.com') ||
          url.includes('www.googleapis.com') ||
          url.includes('/__/auth/iframe') ||
          url.includes('__/auth/iframe') ||
          url.includes('google.com/recaptcha') ||
          url.includes('gstatic.com/recaptcha') ||
          url.includes('recaptcha')
        );

        if (isInteresting) {
          window.__interestingFetchCount = (window.__interestingFetchCount || 0) + 1;
          log(`🌍 fetch ${method} ${url}`, 'log');
        }

        try {
          const res = await originalFetch(input, init);
          if (isInteresting) {
            const ms = Math.round(performance.now() - startedAt);
            log(`🌍 fetch DONE ${res.status} (${ms}ms) ${method} ${url}`, res.ok ? 'success' : 'warning');
          }
          return res;
        } catch (e) {
          if (isInteresting) {
            const ms = Math.round(performance.now() - startedAt);
            log(`🌍 fetch FAILED (${ms}ms) ${method} ${url} :: ${e?.message || e}`, 'error');
          }
          throw e;
        }
      };

      log('✅ Network instrumentation enabled (fetch logging for googleapis + recaptcha)', 'success');
    }

    function instrumentXhr() {
      const XHR = window.XMLHttpRequest;
      if (!XHR || !XHR.prototype) {
        log('⚠️ XMLHttpRequest is not available; cannot instrument XHR calls', 'warning');
        return;
      }

      if (window.__xhrInstrumented) return;
      window.__xhrInstrumented = true;

      const originalOpen = XHR.prototype.open;
      const originalSend = XHR.prototype.send;

      XHR.prototype.open = function(method, url) {
        try {
          this.__diag_method = String(method || 'GET').toUpperCase();
          this.__diag_url = String(url || '');
        } catch {}
        return originalOpen.apply(this, arguments);
      };

      XHR.prototype.send = function(body) {
        const url = this.__diag_url;
        const method = this.__diag_method || 'GET';
        const startedAt = performance.now();

        const isInteresting = typeof url === 'string' && (
          url.includes('identitytoolkit.googleapis.com') ||
          url.includes('securetoken.googleapis.com') ||
          url.includes('www.googleapis.com') ||
          url.includes('/__/auth/iframe') ||
          url.includes('__/auth/iframe') ||
          url.includes('google.com/recaptcha') ||
          url.includes('gstatic.com/recaptcha') ||
          url.includes('recaptcha')
        );

        if (isInteresting) {
          window.__interestingFetchCount = (window.__interestingFetchCount || 0) + 1;
          log(`🌍 XHR ${method} ${url}`, 'log');
        }

        const onDone = () => {
          try {
            if (!isInteresting) return;
            const ms = Math.round(performance.now() - startedAt);
            const status = this.status;
            log(`🌍 XHR DONE ${status} (${ms}ms) ${method} ${url}`, status >= 200 && status < 300 ? 'success' : 'warning');
          } catch {}
        };

        try {
          this.addEventListener('loadend', onDone);
        } catch {}

        return originalSend.apply(this, arguments);
      };

      log('✅ Network instrumentation enabled (XMLHttpRequest logging for googleapis + recaptcha)', 'success');
    }

    // Firebase config from your .env
    const firebaseConfig = {
      apiKey: "AIzaSyB_SsoGd22clhuuqKHPQ_eyEEB8-YHOJvI",
      authDomain: "khuyoot-app01.firebaseapp.com",
      projectId: "khuyoot-app01",
      storageBucket: "khuyoot-app01.firebasestorage.app",
      messagingSenderId: "569942660840",
      appId: "1:569942660840:web:0de5093bc6c26d5b695b5d",
      measurementId: "G-SWKQZDXWS5"
    };

    log('🚀 Initializing Firebase...', 'log');
    let app, auth;
    let persistenceReady = Promise.resolve();
    const persistenceMode = getPersistenceMode();
    if (persistenceSelect) persistenceSelect.value = persistenceMode;

    async function deleteIndexedDb(name) {
      if (!window.indexedDB) return { name, status: 'no-indexeddb' };
      return await new Promise((resolve) => {
        let resolved = false;
        const req = indexedDB.deleteDatabase(name);
        req.onsuccess = () => {
          if (resolved) return;
          resolved = true;
          resolve({ name, status: 'deleted' });
        };
        req.onerror = () => {
          if (resolved) return;
          resolved = true;
          resolve({ name, status: 'error' });
        };
        req.onblocked = () => {
          if (resolved) return;
          resolved = true;
          resolve({ name, status: 'blocked' });
        };

        // Safety timeout so we never hang the UI
        setTimeout(() => {
          if (resolved) return;
          resolved = true;
          resolve({ name, status: 'timeout' });
        }, 4000);
      });
    }

    try {
      // instrumentFetch();
      // instrumentXhr();

      setStatus(
        `Status: <b>Initializing</b><small>` +
        `Origin: <b>${location.origin}</b> | Mode: <b>${persistenceMode}</b>. Waiting for Firebase Auth state…` +
        `</small>`
      );

      app = initializeApp(firebaseConfig);
      log('✅ Firebase app initialized', 'success');

      const persistence =
        persistenceMode === 'memory'
          ? inMemoryPersistence
          : persistenceMode === 'session'
            ? browserSessionPersistence
            : browserLocalPersistence;

      auth = initializeAuth(app, { persistence: [persistence] });
      log(`✅ Firebase Auth instance created (${persistenceMode})`, 'success');
      log(`   Auth domain: ${firebaseConfig.authDomain}`, 'log');
      log(`   Project ID: ${firebaseConfig.projectId}`, 'log');
      log(`   API key prefix: ${firebaseConfig.apiKey?.substring(0, 10)}...`, 'log');

      // initializeAuth configures persistence up-front.
      persistenceReady = Promise.resolve();
    } catch (error) {
      log(`❌ Firebase initialization error: ${error.message}`, 'error');
      log(`   Stack: ${error.stack}`, 'error');
    }

    // Test 1: Auth state listener
    log('', 'log');
    log('📡 Test 1: Setting up auth state listener...', 'log');

    let authStateResolved = false;
    const authStateWatchdog = setTimeout(() => {
      if (authStateResolved) return;
      log('⚠️ Auth state did not resolve within 4 seconds. This often means IndexedDB/persistence is blocked or hanging.', 'warning');
      setStatus(
        `Status: <b>Stuck initializing</b><small>Auth state callback did not fire. If mode is <b>local</b>, try switching to <b>memory</b> and reloading, or close other localhost tabs then click <b>Clear Session</b>.</small>`
      );
      if (persistenceMode === 'local') {
        log('💡 Tip: Change Persistence mode to "Memory" and click "Apply Mode" to bypass IndexedDB and confirm Firebase/network is healthy.', 'warning');
      }
    }, 4000);

    const unsubscribe = onAuthStateChanged(auth, (user) => {
      authStateResolved = true;
      clearTimeout(authStateWatchdog);
      if (user) {
        log(`✅ Auth state changed: User signed in (${user.email})`, 'success');
        setStatus(`Status: <b>Signed in</b> as <b>${user.email || '(no email)'}</b><small>UID: ${user.uid}</small>`);
        setSignedInUi(true);
      } else {
        log(`ℹ️ Auth state changed: No user signed in`, 'warning');
        setStatus('Status: <b>Signed out</b>');
        setSignedInUi(false);
      }
    }, (error) => {
      authStateResolved = true;
      clearTimeout(authStateWatchdog);
      log(`❌ Auth state listener error: ${error.message}`, 'error');
      setStatus(`Status: <b>Error</b><small>${error.message || error}</small>`);
    });

    // Test 2: Network connectivity
    log('', 'log');
    log('🌐 Test 2: Checking network access to Firebase Auth servers...', 'log');
    
    const authUrl = `https://${firebaseConfig.authDomain}`;
    fetch(authUrl, { mode: 'no-cors' })
      .then(() => {
        log(`✅ Network request to ${authUrl} succeeded (or was blocked by CORS, which is expected)`, 'success');
      })
      .catch((error) => {
        log(`❌ Network request to ${authUrl} failed: ${error.message}`, 'error');
        log(`   This suggests firewall/network blocking`, 'error');
      });

    // Test 2b: Direct Identity Toolkit request (bypasses Firebase SDK)
    log('', 'log');
    log('🌐 Test 2b: Direct Identity Toolkit sign-in request (manual fetch)...', 'log');

    async function probeEndpoint(label, endpoint, payload) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 10000);
      const startedAt = performance.now();

      try {
        log(`⏱️ Probe starting (10s timeout) :: ${label}`, 'log');
        log(`   ${endpoint}`, 'log');
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          signal: controller.signal,
        });

        const ms = Math.round(performance.now() - startedAt);
        const text = await res.text();

        let extractedMessage = '';
        try {
          const json = JSON.parse(text);
          extractedMessage = String(json?.error?.message || '');
        } catch {
          extractedMessage = '';
        }

        // For diagnostics we treat any HTTP response as "reachable".
        log(`✅ Probe reachable (${ms}ms) status=${res.status} :: ${label}`, res.ok ? 'success' : 'warning');

        if (extractedMessage) log(`   error.message: ${extractedMessage}`, res.ok ? 'success' : 'warning');

        return { ok: true, status: res.status, message: extractedMessage };
      } catch (e) {
        const ms = Math.round(performance.now() - startedAt);
        const msg = e?.name === 'AbortError' ? 'aborted (timeout)' : (e?.message || e);
        log(`❌ Probe FAILED (${ms}ms) :: ${label} :: ${msg}`, 'error');
        return { ok: false, error: msg, message: '' };
      } finally {
        clearTimeout(timeoutId);
      }
    }

    async function runConnectivityProbes(emailForPayload) {
      const origin = location.origin;
      const href = location.href;

      // Payload intentionally uses an obviously invalid password.
      // We expect a 400 (often INVALID_LOGIN_CREDENTIALS) if the endpoint is reachable.
      const payload = {
        email: emailForPayload || 'probe@example.com',
        password: 'not-a-real-password',
        returnSecureToken: true,
      };

      const v1 = await probeEndpoint(
        'Identity Toolkit v1 (identitytoolkit.googleapis.com)',
        `https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${firebaseConfig.apiKey}`,
        payload
      );

      const v3 = await probeEndpoint(
        'Identity Toolkit v3 (www.googleapis.com)',
        `https://www.googleapis.com/identitytoolkit/v3/relyingparty/verifyPassword?key=${firebaseConfig.apiKey}`,
        payload
      );

      const secureToken = await probeEndpoint(
        'Secure Token (securetoken.googleapis.com)',
        `https://securetoken.googleapis.com/v1/token?key=${firebaseConfig.apiKey}`,
        // This endpoint expects form-encoded; a 400 is still a reachability signal.
        { grant_type: 'refresh_token', refresh_token: 'invalid' }
      );

      const diag = { origin, href, identityToolkitV1: v1, identityToolkitV3: v3, secureToken };
      log(`🧪 Probes summary: ${JSON.stringify(diag)}`, 'log');

      const identityBlocked =
        (v1?.status === 403 && String(v1?.message || '').toLowerCase().includes('blocked')) ||
        (v3?.status === 403 && String(v3?.message || '').toLowerCase().includes('blocked'));

      if (identityBlocked) {
        log('🚫 Identity Toolkit is returning 403 BLOCKED. This is not a browser-network issue.', 'error');
        log('💡 Fix in Google Cloud Console → APIs & Services → Credentials → this API key:', 'warning');
        log('   - Set API restrictions to include: Identity Toolkit API (or Firebase Authentication API)', 'warning');
        log('   - Or temporarily set: Don’t restrict key (to confirm)', 'warning');
        log('   - Ensure the Identity Toolkit API is enabled for the project', 'warning');
      }

      if (v1.ok && !v3.ok) {
        log('⚠️ v1 reachable but v3 FAILED. The Firebase SDK often uses www.googleapis.com (v3) — adblock/AV/proxy can cause auth/network-request-failed.', 'warning');
        log('💡 Fix: allowlist https://www.googleapis.com and disable “Web Shield” / ad blockers for this site.', 'warning');
      }

      if (!v1.ok && !v3.ok) {
        log('❌ Both v1 and v3 probes failed. This is a strong sign of network/extension/firewall blocking, DNS issues, or proxy problems.', 'error');
      }

      // Test 2d: Recaptcha Script Reachability
      const recaptchaUrl = 'https://www.google.com/recaptcha/api.js';
      const controller = new AbortController();
      const outputTimeout = setTimeout(() => controller.abort(), 5000);
      let recaptchaOk = false;
      let recaptchaMsg = '';
      try {
        await fetch(recaptchaUrl, { mode: 'no-cors', signal: controller.signal });
        recaptchaOk = true;
      } catch (e) {
        recaptchaMsg = e.message;
      } finally {
        clearTimeout(outputTimeout);
      }
      
      if (recaptchaOk) {
         log('✅ Recaptcha script reachable (no-cors)', 'success');
      } else {
         log(`❌ Recaptcha script BLOCKED/TIMEOUT: ${recaptchaMsg}`, 'error');
      }

      return diag;
    }

    // Test 2c: Auth iframe reachability (SDK dependency)
    // The Firebase Auth SDK commonly loads:
    //   https://<authDomain>/__/auth/iframe?apiKey=...&appName=...
    // If this is blocked (tracking prevention, extensions, AV web shield), SDK sign-in can hang.
    async function testAuthIframeLoad(options) {
      const timeoutMs = Number(options?.timeoutMs || 7000);
      const startedAt = performance.now();

      const appName = (() => {
        try {
          return app?.name || '[DEFAULT]';
        } catch {
          return '[DEFAULT]';
        }
      })();

      const iframeUrl = `https://${firebaseConfig.authDomain}/__/auth/iframe?apiKey=${encodeURIComponent(
        firebaseConfig.apiKey
      )}&appName=${encodeURIComponent(appName)}&v=${Date.now()}`;

      log('', 'log');
      log('🌐 Test 2c: Loading Firebase Auth iframe…', 'log');
      log(`   ${iframeUrl}`, 'log');

      return await new Promise((resolve) => {
        let done = false;

        const iframe = document.createElement('iframe');
        iframe.style.position = 'fixed';
        iframe.style.left = '-9999px';
        iframe.style.top = '0';
        iframe.style.width = '1px';
        iframe.style.height = '1px';
        iframe.style.opacity = '0';
        iframe.setAttribute('aria-hidden', 'true');
        iframe.tabIndex = -1;

        const cleanup = () => {
          try {
            iframe.onload = null;
            iframe.onerror = null;
          } catch {}
          try {
            iframe.remove();
          } catch {}
        };

        const finish = (result) => {
          if (done) return;
          done = true;
          cleanup();
          resolve(result);
        };

        const timer = setTimeout(() => {
          const ms = Math.round(performance.now() - startedAt);
          log(`❌ Auth iframe TIMEOUT (${ms}ms). Likely blocked by tracking prevention / extensions / AV web shield.`, 'error');
          log('💡 Fix: disable adblock/privacy extensions, allow third-party cookies, and retry in a clean Incognito profile.', 'warning');
          finish({ ok: false, reason: 'timeout', url: iframeUrl });
        }, timeoutMs);

        iframe.onload = () => {
          clearTimeout(timer);
          const ms = Math.round(performance.now() - startedAt);
          log(`✅ Auth iframe LOADED (${ms}ms).`, 'success');
          finish({ ok: true, url: iframeUrl });
        };

        iframe.onerror = () => {
          clearTimeout(timer);
          const ms = Math.round(performance.now() - startedAt);
          log(`❌ Auth iframe ERROR (${ms}ms). Likely blocked by extensions/AV or network policy.`, 'error');
          finish({ ok: false, reason: 'error', url: iframeUrl });
        };

        try {
          document.body.appendChild(iframe);
          iframe.src = iframeUrl;
        } catch (e) {
          clearTimeout(timer);
          const ms = Math.round(performance.now() - startedAt);
          log(`❌ Auth iframe test FAILED (${ms}ms): ${e?.message || e}`, 'error');
          finish({ ok: false, reason: 'exception', url: iframeUrl });
        }
      });
    }

    window.__runAuthIframeTest = () => testAuthIframeLoad({ timeoutMs: 7000 });

    // Auto-run once on page load

    async function directSignInWithActualCreds(email, password) {
      const endpoint = `https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${firebaseConfig.apiKey}`;
      const controller = new AbortController();

        const res = await fetch(endpoint, {

          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, returnSecureToken: true }),
          signal: controller.signal,
        });

        const ms = Math.round(performance.now() - startedAt);
        const text = await res.text();

        if (res.ok) {
          log(`✅ Direct REST sign-in SUCCESS (${ms}ms) status=${res.status}`, 'success');

            const registered = json?.registered;

          } catch {

        log(`⚠️ Direct REST sign-in returned error (${ms}ms) status=${res.status}`, 'warning');
        try {
          const json = JSON.parse(text);
          const message = String(json?.error?.message || '');

          return { ok: false, message };
        } catch {
          log(`   body: ${text.substring(0, 200)}${text.length > 200 ? '…' : ''}`, 'warning');
          return { ok: false, message: '' };
        }
      } catch (e) {
        const ms = Math.round(performance.now() - startedAt);
        const msg = e?.name === 'AbortError' ? 'aborted (timeout)' : (e?.message || e);
        log(`❌ Direct REST sign-in FAILED (${ms}ms): ${msg}`, 'error');

      } finally {
        clearTimeout(timeoutId);
      }
    }

    }

    // Clean up
    window.addEventListener('beforeunload', () => {
      unsubscribe();
    });
  </script>
</body>
</html>
