<!DOCTYPE html>
<html>
<head>
    <title>Firebase Database Test</title>
    <script type="module">
        // Load Firebase from CDN for quick testing
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, getDocs, query, limit, doc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        import { getAuth, createUserWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

        // You need to replace these with your actual config
        const firebaseConfig = {
            apiKey: "AIzaSyC8tZGXJCGBRgGHo0UHIh20EBaxC1Lj3wk",
            authDomain: "khuyoot-app01.firebaseapp.com",
            projectId: "khuyoot-app01",
            storageBucket: "khuyoot-app01.firebasestorage.app",
            messagingSenderId: "569942660840",
            appId: "1:569942660840:web:4a4b3f3e5d5d5d5d5d5d5d"
        };

        window.testFirebase = async function() {
            const log = (msg, type = 'info') => {
                const color = type === 'error' ? 'red' : type === 'success' ? 'green' : 'blue';
                console.log(`%c${msg}`, `color: ${color}; font-weight: bold`);
                document.getElementById('output').innerHTML += `<div style="color: ${color}">${msg}</div>`;
            };

            try {
                log('🔧 Initializing Firebase...', 'info');
                const app = initializeApp(firebaseConfig);
                const db = getFirestore(app);
                const auth = getAuth(app);
                
                log('✅ Firebase initialized successfully', 'success');
                log(`📦 Project: ${firebaseConfig.projectId}`, 'info');
                
                // Test 1: Read existing users
                log('\n📖 Test 1: Reading users collection...', 'info');
                const usersRef = collection(db, 'users');
                const q = query(usersRef, limit(5));
                const snapshot = await getDocs(q);
                
                log(`✅ Read successful: ${snapshot.size} users found`, 'success');
                if (snapshot.size > 0) {
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        log(`  - ${data.shopName || data.name || doc.id} (${data.role})`, 'info');
                    });
                } else {
                    log('  ⚠️ No users in database', 'info');
                }
                
                // Test 2: Check system settings
                log('\n⚙️ Test 2: Reading system settings...', 'info');
                const systemRef = collection(db, 'system');
                const systemSnap = await getDocs(query(systemRef, limit(1)));
                log(`✅ System collection accessible: ${systemSnap.size} docs`, 'success');
                
                // Test 3: Test write permission (create a test document)
                log('\n✍️ Test 3: Testing write permissions...', 'info');
                const testEmail = `test_${Date.now()}@khuyoot.app`;
                const testPassword = 'Test123456';
                
                try {
                    const userCredential = await createUserWithEmailAndPassword(auth, testEmail, testPassword);
                    log(`✅ Auth account created: ${userCredential.user.uid}`, 'success');
                    
                    // Create Firestore document
                    const testDoc = {
                        id: userCredential.user.uid,
                        uid: userCredential.user.uid,
                        email: testEmail,
                        role: 'test',
                        shopName: 'Test Shop',
                        createdAt: serverTimestamp(),
                        test: true
                    };
                    
                    await setDoc(doc(db, 'users', userCredential.user.uid), testDoc);
                    log(`✅ Firestore write successful`, 'success');
                    
                    // Clean up test user
                    await userCredential.user.delete();
                    log(`✅ Test user cleaned up`, 'success');
                    
                } catch (writeError) {
                    if (writeError.code === 'auth/email-already-in-use') {
                        log(`⚠️ Email already exists (previous test not cleaned up)`, 'info');
                    } else {
                        throw writeError;
                    }
                }
                
                log('\n🎉 All database tests passed!', 'success');
                log('Database is working correctly ✅', 'success');
                
            } catch (error) {
                log(`\n❌ Test failed: ${error.message}`, 'error');
                log(`Error code: ${error.code}`, 'error');
                console.error('Full error:', error);
            }
        };

        // Auto-run test on load
        window.addEventListener('load', () => {
            document.getElementById('runTest').addEventListener('click', window.testFirebase);
            window.testFirebase(); // Run immediately
        });
    </script>
    <style>
        body {
            font-family: 'Courier New', monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        #output {
            background: #000;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
            max-height: 600px;
            overflow-y: auto;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #0052a3;
        }
        h1 {
            color: #00ff00;
        }
    </style>
</head>
<body>
    <h1>🔥 Firebase Database Connectivity Test</h1>
    <p>Testing connection to: <strong>khuyoot-app01</strong></p>
    <button id="runTest">🔄 Run Test Again</button>
    <div id="output"></div>
</body>
</html>
