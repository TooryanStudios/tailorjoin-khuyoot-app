<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#grad1)"/>
  
  <!-- Pattern Background -->
  <g opacity="0.1">
    <circle cx="100" cy="100" r="50" fill="white"/>
    <circle cx="1100" cy="500" r="80" fill="white"/>
    <circle cx="300" cy="550" r="40" fill="white"/>
    <circle cx="900" cy="150" r="60" fill="white"/>
  </g>
  
  <!-- Main Icon/Logo -->
  <g transform="translate(450, 150)">
    <!-- Thread/Needle Icon -->
    <circle cx="150" cy="150" r="120" fill="white" opacity="0.2"/>
    <path d="M 120 80 Q 150 60, 180 80 L 180 220 Q 150 240, 120 220 Z" fill="white"/>
    <circle cx="150" cy="90" r="15" fill="none" stroke="white" stroke-width="4"/>
    <line x1="150" y1="75" x2="150" y2="105" stroke="white" stroke-width="3"/>
  </g>
  
  <!-- Text -->
  <text x="600" y="420" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="white" text-anchor="middle">
    خيوط
  </text>
  <text x="600" y="470" font-family="Arial, sans-serif" font-size="40" fill="white" text-anchor="middle" opacity="0.9">
    Khuyoot
  </text>
  <text x="600" y="530" font-family="Arial, sans-serif" font-size="32" fill="white" text-anchor="middle" opacity="0.8">
    منصة تفصيل الملابس
  </text>
</svg>
